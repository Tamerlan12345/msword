version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sizdocflow
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [app-network]

  collabora:
    image: collabora/code
    restart: always
    environment:
      # Разрешаем встраивание для вашего домена бэкенда и решаем 400 ошибку
      - aliasgroup1=https://dmbp1.up.railway.app:443
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:net.frame_ancestors=https://dmbp1.up.railway.app
      - username=admin
      - password=secretpassword
    ports:
      - "9980:9980"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    restart: always
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sizdocflow
      JWT_SECRET: secret123
      PORT: 3000
      BACKEND_URL: https://dmbp1.up.railway.app
      COLLABORA_PUBLIC_URL: https://ds.cic.kz/
      CALLBACK_URL: https://dmbp1.up.railway.app/api/onlyoffice/callback
      UPLOAD_DIR: /app/uploads
      INTERNAL_WOPI_URL: http://backend:3000

    volumes:
      - ./uploads:/app/uploads
      - ./frontend/dist:/frontend/dist
      - ./server_files:/data_storage
    depends_on: [postgres, collabora]
    networks: [app-network]

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
