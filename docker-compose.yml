version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sizdocflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - app-network

  onlyoffice:
    image: onlyoffice/documentserver
    container_name: msword-onlyoffice
    restart: always
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=secret123
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    ports:
      - "8081:80" # Changed to 8081 to avoid conflict with adminer on 8080
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
    networks:
      - app-network

volumes:
  postgres_data:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_lib:

networks:
  app-network:
    driver: bridge
