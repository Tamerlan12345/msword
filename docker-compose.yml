version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sizdocflow
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [app-network]

  collabora:
    image: collabora/code
    restart: always
    environment:
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      - username=${COLLABORA_USERNAME:-admin}
      - password=${COLLABORA_PASSWORD:-admin}
      - aliasgroup1=https://.*:443
    ports: ["9980:9980"]
    cap_add:
      - MKNOD
    networks: [app-network]

  backend:
    build:
      context: ./backend
    restart: always
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sizdocflow
      ONLYOFFICE_API_URL: http://localhost:8081
      CALLBACK_URL: http://backend:3000/api/onlyoffice/callback
      JWT_SECRET: super-secret-key-change-it
      ONLYOFFICE_JWT_SECRET: secret123
      PORT: 3000
      # New variables for WOPI/Collabora
      WOPI_HOST_URL: http://backend:3000
      COLLABORA_URL: http://localhost:9980
    volumes:
      - ./uploads:/app/uploads
      - ./frontend/dist:/frontend/dist
    depends_on: [postgres, collabora]
    networks: [app-network]

volumes:
  postgres_data:
  # onlyoffice_data: removed

networks:
  app-network:
    driver: bridge
