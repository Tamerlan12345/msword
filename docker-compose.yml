version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sizdocflow
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [app-network]

  collabora:
    image: collabora/code
    restart: always
    environment:
      # Важно: отключаем SSL внутри контейнера, так как Railway дает внешний SSL
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      # Разрешаем встраивание ТОЛЬКО для вашего домена бэкенда/фронтенда
      - aliasgroup1=https://dmbp.up.railway.app
      - username=admin
      - password=secretpassword
    ports:
      - "9980:9980"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    restart: always
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/sizdocflow
      JWT_SECRET: secret123
      PORT: 3000
      BACKEND_URL: https://dmbp.up.railway.app
      PUBLIC_URL: https://dmbp.up.railway.app
      INTERNAL_WOPI_URL: http://backend:3000
      COLLABORA_PUBLIC_URL: https://collabora-dmbp.up.railway.app
      # Optional: keep for local dev or internal references if code uses them
      WOPI_HOST_URL: http://backend:3000
      COLLABORA_URL: http://collabora:9980
    volumes:
      - ./uploads:/app/uploads
      - ./frontend/dist:/frontend/dist
    depends_on: [postgres, collabora]
    networks: [app-network]

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
